name: Member3 CI

on:
  push:
    paths:
      - 'integration/**'
      - 'execution/**'
      - 'member3/**'
      - 'requirements/**'
      - 'tests/**'
  pull_request:
    paths:
      - 'integration/**'
      - 'execution/**'
      - 'member3/**'
      - 'requirements/**'
      - 'tests/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/member3.txt
          pip install -r requirements/member3.txt || true
      - name: Run tests
        run: |
          pytest -q
