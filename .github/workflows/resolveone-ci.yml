name: ResolveOne CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GOLD_RELEASE_TAG: gold-data-v1
  GOLD_ASSET: gold_exception_cases.parquet

jobs:
  real-gold-tests:
    name: Real Gold data tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Download and verify governed Gold data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/processed
          gh release download "$GOLD_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$GOLD_ASSET" --dir data/processed
          gh release download "$GOLD_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$GOLD_ASSET.sha256" --dir data/processed
          cd data/processed && sha256sum --check "$GOLD_ASSET.sha256"
      - name: Run fast checks against the governed Gold artifact
        env:
          RESOLVEONE_GOLD_PARQUET: data/processed/gold_exception_cases.parquet
          RESOLVEONE_USE_FAKE_GOVERNANCE: "1"
        run: pytest -q tests/chat tests/ui tests/agent/test_evidence_boundary.py tests/agent/test_mdm_rag.py tests/security/agent_policy_gate_test.py tests/integration/test_orchestrator.py

  governed-integration-tests:
    name: Governed integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: resolveone
          POSTGRES_USER: resolveone
          POSTGRES_PASSWORD: resolveone-ci
        options: >-
          --health-cmd "pg_isready -U resolveone -d resolveone"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 6379:6379
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/resolveone-ci
        options: >-
          --health-cmd "cypher-shell -u neo4j -p resolveone-ci 'RETURN 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
        ports:
          - 7474:7474
          - 7687:7687
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Download and verify governed Gold data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/processed
          gh release download "$GOLD_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$GOLD_ASSET" --dir data/processed
          gh release download "$GOLD_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$GOLD_ASSET.sha256" --dir data/processed
          cd data/processed && sha256sum --check "$GOLD_ASSET.sha256"
      - name: Build approved pgvector policy index
        env:
          RESOLVEONE_PG_DSN: postgresql://resolveone:resolveone-ci@localhost:5432/resolveone
        run: python -m agent.build_index
      - name: Run governed end-to-end integration suite
        env:
          RESOLVEONE_GOLD_PARQUET: data/processed/gold_exception_cases.parquet
          RESOLVEONE_PG_DSN: postgresql://resolveone:resolveone-ci@localhost:5432/resolveone
          RESOLVEONE_REDIS_HOST: localhost
          RESOLVEONE_REDIS_PORT: "6379"
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: resolveone-ci
          NEO4J_DATABASE: neo4j
          RESOLVEONE_CONTEXT_SIGNING_KEY: ci-context-signing-key
          RESOLVEONE_RECEIPT_SIGNING_KEY: ci-receipt-signing-key
          RESOLVEONE_RUN_VECTOR_VALIDATION: "1"
          RESOLVEONE_USE_FAKE_GOVERNANCE: "0"
        run: pytest -q --ignore=tests/integration/test_orchestrator.py